name: Release

# Push a tag such as v4.2.0 (matching package.json) to build, verify and
# publish the portable Windows ZIP. Installed copies pick it up at startup.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches package.json
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -cne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build and run the full test suite
        run: npm test

      - name: Package, assemble, verify and zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $out = Join-Path $env:RUNNER_TEMP 'package'
          $folder = Join-Path $out "Slayer Target Planner $version - Windows"
          $zip = Join-Path $env:RUNNER_TEMP "Slayer Target Planner $version - Windows.zip"
          npm run package:windows -- $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/release/assemble_windows_share.py $folder
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/release/verify-windows-share.cjs $folder
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/release/package_share.py $folder $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub stores spaces in asset names as dots, which is the
          # Slayer.Target.Planner.<version>.-.Windows.zip name the updater expects.
          gh release create '${{ github.ref_name }}' $env:ZIP ($env:ZIP -replace '\.zip$', '.zip.sha256.txt') `
            --title 'Slayer Target Planner ${{ steps.version.outputs.version }}' `
            --generate-notes --verify-tag
